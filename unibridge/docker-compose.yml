version: "3.9"

# =============================================================================
# UniBridge — Docker Compose
# All 7 services on a shared internal network
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # Auth Service
  # ---------------------------------------------------------------------------
  auth:
    build:
      context: ./services/auth
      dockerfile: Dockerfile
    container_name: unibridge-auth
    env_file:
      - .env
    environment:
      JWT_SECRET: ${JWT_SECRET}
      AUTH_PORT: ${AUTH_PORT}
    ports:
      - "${AUTH_PORT}:${AUTH_PORT}"
    volumes:
      - auth_store:/app/auth_store
    networks:
      - unibridge-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:${AUTH_PORT}/health" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Data Service (ChromaDB)
  # ---------------------------------------------------------------------------
  data:
    build:
      context: ./services/data
      dockerfile: Dockerfile
    container_name: unibridge-data
    env_file:
      - .env
    environment:
      DATA_PORT: ${DATA_PORT}
    ports:
      - "${DATA_PORT}:${DATA_PORT}"
    volumes:
      - chroma_store:/app/chroma_db
    networks:
      - unibridge-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:${DATA_PORT}/health" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Search Service
  # ---------------------------------------------------------------------------
  search:
    build:
      context: ./services/search
      dockerfile: Dockerfile
    container_name: unibridge-search
    env_file:
      - .env
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      DATA_URL: ${DATA_URL}
      ANALYTICS_URL: ${ANALYTICS_URL}
      SEARCH_PORT: ${SEARCH_PORT}
    ports:
      - "${SEARCH_PORT}:${SEARCH_PORT}"
    networks:
      - unibridge-network
    depends_on:
      data:
        condition: service_healthy
      analytics:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:${SEARCH_PORT}/health" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Submission Service
  # ---------------------------------------------------------------------------
  submission:
    build:
      context: ./services/submission
      dockerfile: Dockerfile
    container_name: unibridge-submission
    env_file:
      - .env
    environment:
      DATA_URL: ${DATA_URL}
      SUBMISSION_PORT: ${SUBMISSION_PORT}
    ports:
      - "${SUBMISSION_PORT}:${SUBMISSION_PORT}"
    volumes:
      - submission_store:/app/submission_store
    networks:
      - unibridge-network
    depends_on:
      data:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:${SUBMISSION_PORT}/health" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Analytics Service
  # ---------------------------------------------------------------------------
  analytics:
    build:
      context: ./services/analytics
      dockerfile: Dockerfile
    container_name: unibridge-analytics
    env_file:
      - .env
    environment:
      ANALYTICS_PORT: ${ANALYTICS_PORT}
    ports:
      - "${ANALYTICS_PORT}:${ANALYTICS_PORT}"
    volumes:
      - analytics_store:/app/analytics_store
    networks:
      - unibridge-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:${ANALYTICS_PORT}/health" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Admin Service
  # ---------------------------------------------------------------------------
  admin:
    build:
      context: ./services/admin
      dockerfile: Dockerfile
    container_name: unibridge-admin
    env_file:
      - .env
    environment:
      AUTH_URL: ${AUTH_URL}
      SUBMISSION_URL: ${SUBMISSION_URL}
      ANALYTICS_URL: ${ANALYTICS_URL}
      DATA_URL: ${DATA_URL}
      ADMIN_PORT: ${ADMIN_PORT}
    ports:
      - "${ADMIN_PORT}:${ADMIN_PORT}"
    networks:
      - unibridge-network
    depends_on:
      auth:
        condition: service_healthy
      submission:
        condition: service_healthy
      analytics:
        condition: service_healthy
      data:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:${ADMIN_PORT}/health" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # API Gateway  (starts last — depends on all other services)
  # ---------------------------------------------------------------------------
  gateway:
    build:
      context: ./services/gateway
      dockerfile: Dockerfile
    container_name: unibridge-gateway
    env_file:
      - .env
    environment:
      JWT_SECRET: ${JWT_SECRET}
      AUTH_URL: ${AUTH_URL}
      SEARCH_URL: ${SEARCH_URL}
      SUBMISSION_URL: ${SUBMISSION_URL}
      ANALYTICS_URL: ${ANALYTICS_URL}
      ADMIN_URL: ${ADMIN_URL}
      GATEWAY_PORT: ${GATEWAY_PORT}
    ports:
      - "${GATEWAY_PORT}:${GATEWAY_PORT}"
    networks:
      - unibridge-network
    depends_on:
      auth:
        condition: service_healthy
      search:
        condition: service_healthy
      data:
        condition: service_healthy
      submission:
        condition: service_healthy
      analytics:
        condition: service_healthy
      admin:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:${GATEWAY_PORT}/health" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

# =============================================================================
# Volumes — persistent storage across container restarts
# =============================================================================
volumes:
  chroma_store:
    driver: local
  auth_store:
    driver: local
  submission_store:
    driver: local
  analytics_store:
    driver: local

# =============================================================================
# Networks
# =============================================================================
networks:
  unibridge-network:
    driver: bridge
